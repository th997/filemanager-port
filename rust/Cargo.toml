[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-vfs",
    "crates/fm-local",
    "crates/fm-archive",
    "crates/fm-remote",
    "crates/fm-server",
    "crates/fm-index",
    "crates/fm-ops",
    "crates/fm-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
fm-core = { path = "crates/fm-core" }
fm-vfs = { path = "crates/fm-vfs" }
fm-local = { path = "crates/fm-local" }
fm-archive = { path = "crates/fm-archive" }
fm-remote = { path = "crates/fm-remote" }
fm-server = { path = "crates/fm-server" }
fm-index = { path = "crates/fm-index" }
fm-ops = { path = "crates/fm-ops" }

async-trait = "0.1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
