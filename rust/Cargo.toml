[workspace]
resolver = "2"
members = [
    "crates/fm-core",
    "crates/fm-vfs",
    "crates/fm-local",
    "crates/fm-archive",
    "crates/fm-remote",
    "crates/fm-server",
    "crates/fm-index",
    "crates/fm-ops",
    "crates/fm-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
fm-core = { path = "crates/fm-core" }
fm-vfs = { path = "crates/fm-vfs" }
fm-local = { path = "crates/fm-local" }
fm-archive = { path = "crates/fm-archive" }
fm-remote = { path = "crates/fm-remote" }
fm-server = { path = "crates/fm-server" }
fm-index = { path = "crates/fm-index" }
fm-ops = { path = "crates/fm-ops" }

async-trait = "0.1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["compat", "io", "io-util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
opendal = { version = "0.59", default-features = false, features = ["services-s3", "services-oss", "services-webdav", "http-transport-reqwest", "executors-tokio"] }
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
webpki-root-certs = "1"
smb2 = { version = "0.31", features = ["tokio"] }
russh = "0.64"
russh-sftp = "3.0"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
sevenz-rust = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
libunftp = { version = "0.23", default-features = false }
uuid = { version = "1", features = ["v4", "fast-rng"] }
parking_lot = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
regex = "1"
hex = "0.4"
