name: flutter

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths: ["app/**", "rust/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["app/**", "rust/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev libmpv-dev \
            libdbus-1-dev libsecret-1-dev
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package Linux
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czf "${{ github.workspace }}/filemanager-linux-x64.tar.gz" *
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-linux-x64
          path: filemanager-linux-x64.tar.gz
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: filemanager-linux-x64.tar.gz

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev libmpv-dev \
            libdbus-1-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          git config --global --add safe.directory $HOME/flutter
      - name: Build Linux ARM64
        working-directory: app
        run: |
          $HOME/flutter/bin/flutter pub get
          $HOME/flutter/bin/flutter build linux --release
      - name: Package Linux ARM64
        run: |
          cd app/build/linux/arm64/release/bundle
          tar -czf "${{ github.workspace }}/filemanager-linux-arm64.tar.gz" *
      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-linux-arm64
          path: filemanager-linux-arm64.tar.gz
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: filemanager-linux-arm64.tar.gz

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build APK (Universal & Split per ABI)
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Prepare Android Artifacts
        run: |
          mkdir -p "${{ github.workspace }}/android-apks"
          cd app/build/app/outputs/flutter-apk
          cp app-release.apk "${{ github.workspace }}/android-apks/filemanager-android-universal.apk"
          cp app-arm64-v8a-release.apk "${{ github.workspace }}/android-apks/filemanager-android-arm64-v8a.apk"
          cp app-armeabi-v7a-release.apk "${{ github.workspace }}/android-apks/filemanager-android-armeabi-v7a.apk"
          cp app-x86_64-release.apk "${{ github.workspace }}/android-apks/filemanager-android-x86_64.apk"
      - name: Upload Android arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-android-arm64-v8a
          path: android-apks/filemanager-android-arm64-v8a.apk
      - name: Upload Android armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-android-armeabi-v7a
          path: android-apks/filemanager-android-armeabi-v7a.apk
      - name: Upload Android x86_64
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-android-x86_64
          path: android-apks/filemanager-android-x86_64.apk
      - name: Upload Android Universal
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-android-universal
          path: android-apks/filemanager-android-universal.apk
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-apks/*.apk

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust fm-ffi
        working-directory: rust
        run: cargo build -p fm_ffi --release
      - name: Build Windows
        working-directory: app
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: flutter build windows --release -v
      - name: Package Release
        shell: pwsh
        run: Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "filemanager-windows-x64.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-windows-x64
          path: filemanager-windows-x64.zip
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: filemanager-windows-x64.zip

  apple:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build macOS Release
        working-directory: app
        run: flutter build macos --release
      - name: Package macOS Application
        run: |
          cd app/build/macos/Build/Products/Release
          zip -r -y "${{ github.workspace }}/filemanager-macos.zip" filemanager.app
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-macos
          path: filemanager-macos.zip
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: filemanager-macos.zip
      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --debug --no-codesign
